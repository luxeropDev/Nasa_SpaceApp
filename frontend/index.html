<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PyroLens — Scientific Evidence Intelligence for Spacecraft Fire Safety. Independent project; not affiliated with NASA." />
    <meta name="theme-color" content="#000000" />
    <title>PyroLens</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" type="image/webp" href="/media/hero-1600.webp" imagesrcset="/media/hero-960.webp 960w, /media/hero-1600.webp 1600w, /media/hero-2400.webp 2400w" imagesizes="(min-width: 1024px) 58vw, 100vw" />
    <script>
      // PyroLens uses one fixed editorial theme. Apply only the saved interface language before first paint.
      (function () {
        try {
          document.documentElement.classList.remove("dark");
          document.documentElement.style.colorScheme = "light";
          localStorage.removeItem("flamewise.theme");
          var l = localStorage.getItem("flamewise.lang");
          if (l === "en" || l === "ru") document.documentElement.lang = l;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
