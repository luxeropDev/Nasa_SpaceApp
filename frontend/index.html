<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FLAMEWISE — research intelligence for microgravity combustion and spacecraft fire safety. Independent project; not affiliated with NASA." />
    <meta name="theme-color" content="#080B12" />
    <title>FLAMEWISE</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply persisted theme/lang before first paint. Dark is the primary experience when nothing is saved.
      (function () {
        try {
          var t = localStorage.getItem("flamewise.theme");
          if (t !== "light" && t !== "dark") t = "dark";
          document.documentElement.classList.toggle("dark", t === "dark");
          document.documentElement.style.colorScheme = t;
          var l = localStorage.getItem("flamewise.lang");
          if (l === "en" || l === "ru") document.documentElement.lang = l;
          if (localStorage.getItem("flamewise.sidebar") === "collapsed") document.documentElement.dataset.sidebar = "collapsed";
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
